# FASE 2 — HTTP + HTTPS. Copiar a /opt/nginx/conf.d/mdw.conf en el VPS SOLO
# después de que exista /etc/letsencrypt/live/mdw.guillermonatali.com/.
# Validar y recargar: docker exec global-nginx nginx -t && docker exec global-nginx nginx -s reload
server {
    listen 80;
    server_name mdw.guillermonatali.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name mdw.guillermonatali.com;
    ssl_certificate     /etc/letsencrypt/live/mdw.guillermonatali.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mdw.guillermonatali.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        # NOMBRE DEL CONTAINER (docker ps), no del servicio
        proxy_pass         http://mdw-app:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }
}
