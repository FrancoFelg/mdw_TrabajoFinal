# FASE 2 — HTTP + HTTPS. Copiar a /opt/nginx/conf.d/mdw.conf en el VPS SOLO
# después de que exista /etc/letsencrypt/live/mdw.guillermonatali.com/.
# Validar y recargar: docker exec global-nginx nginx -t && docker exec global-nginx nginx -s reload
# Límites por IP para los endpoints públicos. La clave vacía no cuenta, así que cada zona
# solo limita las solicitudes que coinciden con su map. Los formularios (Server Actions)
# envían POST a la URL de su página, por eso se incluyen /login, /registro y /reportar.
# Las tasas son amplias a propósito: un aula entera puede salir por la misma IP.
map "$request_method:$uri" $mdw_clave_auth {
    default "";
    "~^POST:/(api/auth/login|login|api/usuarios|registro)/?$" $binary_remote_addr;
}
map "$request_method:$uri" $mdw_clave_reporte {
    default "";
    "~^POST:/(api/emergencias|reportar)/?$" $binary_remote_addr;
}
map $uri $mdw_clave_geo {
    default "";
    "~^/api/direcciones/" $binary_remote_addr;
}
limit_req_zone $mdw_clave_auth    zone=mdw_auth:10m    rate=20r/m;
limit_req_zone $mdw_clave_reporte zone=mdw_reporte:10m rate=20r/m;
limit_req_zone $mdw_clave_geo     zone=mdw_geo:10m     rate=120r/m;

server {
    listen 80;
    server_name mdw.guillermonatali.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name mdw.guillermonatali.com;
    ssl_certificate     /etc/letsencrypt/live/mdw.guillermonatali.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mdw.guillermonatali.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Certificados de hasta 5 MB más el resto del formulario (default de nginx: 1 MB)
    client_max_body_size 6m;

    location / {
        limit_req zone=mdw_auth    burst=20 nodelay;
        limit_req zone=mdw_reporte burst=20 nodelay;
        limit_req zone=mdw_geo     burst=60 nodelay;
        limit_req_status 429;

        # NOMBRE DEL CONTAINER (docker ps), no del servicio
        proxy_pass         http://mdw-app:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }
}
