# FASE 1 — solo HTTP. Copiar a /opt/nginx/conf.d/mdw.conf en el VPS ANTES de
# generar el cert. Sirve el challenge ACME y redirige todo lo demás a HTTPS.
# Cuando el cert exista, reemplazar por mdw.conf (fase 2).
server {
    listen 80;
    server_name mdw.guillermonatali.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
