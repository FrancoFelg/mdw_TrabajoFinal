# =============================================================================
# Docker Compose - PRODUCCIÓN (VPS guillermonatali.com)
# Dominio: https://mdw.guillermonatali.com
# =============================================================================

name: mdw

# Aislamiento respecto a las otras apps del VPS (compartido con prod):
#   - límites de CPU/RAM por container (no puede starvear a las demás)
#   - logs rotados (no puede llenar el disco)
#   - sin escalada de privilegios dentro del container
# Ajustar los números según el servidor real.
x-limits-app: &limits-app
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  security_opt:
    - no-new-privileges:true

services:
  # ---------------------------------------------------------------------------
  # App Next.js (standalone). Sin `ports`: solo la alcanza global-nginx por
  # proxy-network usando el NOMBRE DEL CONTAINER (mdw-app:3000).
  # ---------------------------------------------------------------------------
  app:
    build:
      # Contexto en la raíz del repo porque el build necesita package.json,
      # el código y el lockfile de pnpm
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: runner
    image: mdw-app:prod
    container_name: mdw-app
    restart: unless-stopped
    <<: *limits-app
    environment:
      NODE_ENV: production
      # Host = nombre del servicio `db`, resuelto por DNS interno de compose
      DATABASE_URL: mysql://${MYSQL_USER:?}:${MYSQL_PASSWORD:?}@db:3306/${MYSQL_DATABASE:?}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio}
    expose:
      - "3000"
    healthcheck:
      # busybox wget viene en alpine; --spider no descarga el body
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - proxy-network # para que global-nginx lo alcance
      - internal      # red privada con su DB

  # ---------------------------------------------------------------------------
  # Migraciones: corre una vez y termina. `restart: "no"` es clave, si no
  # compose lo reinicia en loop cuando sale con 0.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: migrate
    image: mdw-migrate:prod
    container_name: mdw-migrate
    restart: "no"
    <<: *limits-app
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:?}:${MYSQL_PASSWORD:?}@db:3306/${MYSQL_DATABASE:?}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # MySQL. SIN `ports` y solo en la red `internal` (sin salida a internet).
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.4
    container_name: mdw-db
    restart: unless-stopped
    # Las migraciones se generan en Windows, donde MySQL ignora mayúsculas en
    # nombres de tabla (hay ALTER TABLE `certificadoatributo` sobre una tabla
    # creada como `CertificadoAtributo`). En Linux el default distingue y la
    # migración muere. Este flag replica el comportamiento de Windows.
    # OJO: solo se puede fijar al INICIALIZAR el datadir. Si ya existe
    # db_data con otro valor, MySQL no arranca: borrar db_data y recrear.
    command: --lower-case-table-names=1
    # MySQL 8 con menos de ~768M se pone inestable; 1G es el piso razonable
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging: *logging
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD es obligatorio}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE es obligatorio}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER es obligatorio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD es obligatorio}
    volumes:
      - ./db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Le da tiempo a la inicialización del datadir en el primer arranque
      # antes de empezar a contar fallos
      start_period: 30s
    networks:
      - internal

networks:
  # Ya existe en el VPS; la comparten todas las apps con global-nginx
  proxy-network:
    external: true
  # `internal: true` = sin acceso a internet ni al host. Solo app <-> db.
  internal:
    internal: true
